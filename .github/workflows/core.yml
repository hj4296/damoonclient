# Damoon Core(게임 안 기능 모드) 빌드 + 가상 화면 실행 테스트
# 결과(빌드 로그, 게임 로그, 스크린샷)는 ci/<타깃> 브랜치에 올라갑니다.
name: Build Damoon Core

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'core/probe-1.21.11/**', '.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabric-1_21_1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/fabric-1.21.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: 최신 Fabric 버전 확인
        run: |
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader/1.21.1 | jq -r '[.[] | select(.loader.stable)][0].loader.version')
          API=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oP '(?<=<version>)[^<]*\+1\.21\.1(?=</version>)' | tail -1)
          echo "loader=$LOADER api=$API"
          echo "GARGS=-Ploader_version=$LOADER -Pfabric_version=$API" >> $GITHUB_ENV

      - name: 빌드
        run: |
          set -o pipefail
          gradle build $GARGS --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 가상 화면에서 게임 실행 + 스크린샷
        if: success()
        run: bash ../ci-smoke.sh fabric

      - name: 결과 올리기 (ci/fabric-1.21.1 브랜치)
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp build.log run.log /tmp/ci/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/ci/game.log 2>/dev/null || true
          cp *.png /tmp/ci/ 2>/dev/null || true
          cp -r crash-reports /tmp/ci/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci
          git init -q && git checkout -q -b ci
          git add -A && git -c user.name=ci -c user.email=ci@damoon commit -qm "run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci:ci/fabric-1.21.1

      - name: 배포용 jar 준비
        run: |
          mkdir -p ../../dist-core
          cp $(ls build/libs/*.jar | grep -v -- '-sources' | head -1) ../../dist-core/damoon-core-fabric-1.21.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: damoon-core-fabric-1.21.1
          path: dist-core/*.jar
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-core/*.jar

  forge-1_8_9:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/forge-1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4

      - name: 빌드
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 결과 올리기 (ci/forge-1.8.9 브랜치)
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp build.log run.log /tmp/ci/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/ci/game.log 2>/dev/null || true
          cp *.png /tmp/ci/ 2>/dev/null || true
          cp -r crash-reports /tmp/ci/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci
          git init -q && git checkout -q -b ci
          git add -A && git -c user.name=ci -c user.email=ci@damoon commit -qm "run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci:ci/forge-1.8.9

      - name: 배포용 jar 준비
        run: |
          mkdir -p ../../dist-core
          cp $(ls build/libs/*.jar | grep -v -- '-sources\|-dev' | head -1) ../../dist-core/damoon-core-forge-1.8.9.jar
      - uses: actions/upload-artifact@v4
        with:
          name: damoon-core-forge-1.8.9
          path: dist-core/*.jar
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-core/*.jar

  # 실제 사용자처럼: Damoon 런처 코드로 버전·로더를 설치하고 빌드된 Damoon Core를 넣어 실행
  e2e:
    needs: [fabric-1_21_1, forge-1_8_9]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: forge-1.8.9
            loader: forge
            mc: '1.8.9'
            mode: forge
            jar: dist-core/damoon-core-forge-1.8.9.jar
          - name: fabric-1.21.1
            loader: fabric
            mc: '1.21.1'
            mode: fabric
            jar: dist-core/damoon-core-fabric-1.21.1.jar
          - name: fabric-26.3
            loader: fabric
            mc: '26.3'
            mode: plain
            jar: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: damoon-core-*
          path: dist-core
          merge-multiple: true
      - name: 런처 코드로 설치·실행 + 스크린샷
        env:
          LAUNCH: node test/e2e-launch.js ${{ matrix.loader }} ${{ matrix.mc }} ${{ matrix.jar }}
        run: bash core/ci-smoke.sh ${{ matrix.mode }}
      - name: 결과 올리기 (ci/e2e-${{ matrix.name }})
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp run.log game.log /tmp/ci/ 2>/dev/null || true
          cp *.png /tmp/ci/ 2>/dev/null || true
          cp -r crash-reports /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci
          git init -q && git checkout -q -b ci
          git add -A && git -c user.name=ci -c user.email=ci@damoon commit -qm "run ${{ github.run_id }}" --allow-empty
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci:ci/e2e-${{ matrix.name }}
