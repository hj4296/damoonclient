# GitHub에 올리면 자동으로 Windows .exe / macOS .dmg / Linux AppImage 를 빌드합니다.
# Actions 탭 → 해당 실행 → 아래 Artifacts 에서 다운로드
# v1.0.0 같은 태그를 푸시하면 Releases 에도 자동 업로드됩니다.
name: Build Damoon Client

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: damoon-client-${{ matrix.os }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
